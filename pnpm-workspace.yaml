# Workspace globs for the Nexus hub. Anything not matched here is NOT part of the
# pnpm/Turborepo workspace.
# The settings below are duplicated from the root package.json's `pnpm` field,
# and both copies have to stay in step until `packageManager` moves off pnpm 9.
# pnpm 9 — which is what CI installs, from `packageManager` — reads them from
# package.json and knows nothing about them here. pnpm 10 does the opposite and
# warns that the package.json field "is no longer read", which is how a bumped
# override can look applied locally and silently not be in CI. Keeping both is
# the only arrangement where every reader sees the same floors.
packages:
  - "floc/apps/*"
  - "floc/packages/*"
  - "floc/marketing"
  - "floc/pipelines/*"
  - "shared/packages/*"
  - "internal-tools/*"
  - "enablement/cli"

neverBuiltDependencies:
  - esbuild

# Security gates are fixed, never weakened (security-compliance/CLAUDE.md), so
# an advisory reached through a transitive dep is pinned forward here rather
# than muted in the audit step. Each entry is a `pnpm audit` finding, set to the
# patched floor the advisory itself names.
overrides:
  vitest: ^3.2.6
  vite: ^6.4.4
  # GHSA-rgj7-g3m4-5g8c — libheif flaws reached through the bundled binary.
  # Patched in 0.35.4; GHSA-wq5f-xc86-pv6w (librsvg) moved the floor to 0.35.5.
  sharp: ^0.35.5
  postcss: ^8.5.18
  # GHSA-2883-xcg3-v3hh — maxTotalMergeKeys does not bound CPU on empty merge
  # sources, so a crafted document still burns the parser. Reached through
  # Expo's toolchain; patched in 4.3.2.
  js-yaml: ^4.3.2
  nanoid: ^3.3.17
  # GHSA-qhr7-859c-m2p7 and GHSA-6j4f-fj2g-mc7p — recursive parsing and
  # expansion can exhaust the stack. Both are patched by 5.0.11.
  brace-expansion: ^5.0.11
  glob>minimatch: ^10.0.1
  # GHSA-67mh-4wv8-2f99 — any website can make the dev server answer its
  # requests. Reached only through @esbuild-kit/*, which drizzle-kit still
  # pulls in and which is itself deprecated; patched in 0.25.0.
  esbuild: ^0.25.0
  # Both reachable only through Expo's toolchain (#289) and both patchable, so
  # they are pinned forward like every other entry rather than ignored below.
  uuid: ^11.1.1
  decode-uri-component: ^0.5.1
  # GHSA-68fv-2mgg-jv7q, GHSA-vc2v-76pw-4v95, GHSA-5gmw-xhrv-c9v3, GHSA-85c8-ppgw-ccpr and
  # GHSA-pqg4-j6r4-53mv — all transitive (Vitest, Expo's CLI, Metro); pinned to the patched floors.
  source-map-js: ^1.2.2
  compression: ^1.8.2
  tinypool: ^2.1.2
  shell-quote: ^1.11.0
  # GHSA-2464-fhr4-w9xw (critical) and GHSA-p3m5-59mp-jv5r — the web app's own Next,
  # and the copy better-auth pulls in for the phone; patched in 15.5.28.
  next: ^15.5.28
  # GHSA-mrhx-c7xc-m3w5 — oversized constrained collections exhaust memory. Every
  # zod 4 copy (better-auth, @floc/api) to the patched floor, 4.6.6.
  zod@^4.0.0: ^4.6.6
  # GHSA-834v-8h66-3h79 — undici errors out on excessive content-encodings (DoS). Reached
  # through happy-dom in the editor's tests; patched in 7.30.1.
  undici: ^7.30.1

# The one thing an override cannot answer: an advisory with NO patched version.
#
# `image-size` 2.0.2 is the latest release and every version is vulnerable —
# the advisories name a patched range of "<0.0.0", meaning no fix exists. It
# arrives only through Metro, Expo's bundler (#289), so it runs on a developer
# machine while building and is in neither the shipped app nor any server.
#
# Pinning forward is impossible and weakening `--audit-level=high` would hide
# every future finding, so the exception is scoped to these two GHSAs and
# nothing else. REVIEW THIS when image-size next publishes: if a fixed version
# exists, delete both lines and add an override instead.
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr # image-size: ICNS parser infinite loop (DoS)
    - GHSA-5p2g-fcmc-qvqq # image-size: JXL/HEIF parser infinite loops (DoS)
    # Same case, 2026-10-19: no patched version ('<0.0.0'), not in the built web app.
    # node-forge comes only through @expo/cli's code-signing certificates; braces
    # only through Metro's file map and eslint-config-next. Delete when either fixes.
    - GHSA-86w9-cpqp-85rv # node-forge, via @expo/cli
    - GHSA-vfj7-8cjw-p6xm # braces, via Metro and ESLint
    # 2026-10-23: zod 3 has no patched release — the fix starts at 4.6.6. The one zod 3
    # left is @expo/cli's own, a developer-machine tool; every zod 4 copy is pinned above.
    - GHSA-mrhx-c7xc-m3w5 # zod 3, via @expo/cli
