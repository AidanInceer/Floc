sonar.projectKey=AidanInceer_Floc
sonar.organization=aidaninceer
sonar.projectName=Floc

# Only the product code under ./floc is in Sonar's analysis scope.
sonar.sources=floc
sonar.tests=floc
sonar.inclusions=floc/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Vitest writes LCOV reports in each package that has a test script.
sonar.javascript.lcov.reportPaths=floc/apps/mobile/coverage/lcov.info,floc/apps/web/coverage/lcov.info,floc/packages/floc-api/coverage/lcov.info,floc/packages/floc-core/coverage/lcov.info,floc/packages/floc-editor/coverage/lcov.info,floc/packages/floc-globe/coverage/lcov.info,floc/marketing/coverage/lcov.info

# Keep all floc code in Sonar's code-quality analysis, but match the unit-test
# boundary: native screens and presentational components are not covered by
# the Node-based Vitest suites.
# Tool config files (eslint, vitest, next, playwright) hold no app logic to test.
# CLI entry points, the schema and the studio's browser scenes mirror what each
# vitest.config.ts leaves out; `pnpm quality:check` fails on a gap.
sonar.coverage.exclusions=floc/apps/mobile/app/**,floc/apps/web/scripts/**,floc/apps/web/src/db/**,floc/marketing/studio/**,floc/marketing/src/cli.ts,floc/marketing/src/render.ts,floc/marketing/src/studio.ts,floc/apps/**/src/components/**,floc/apps/**/src/app/**/page.tsx,floc/apps/**/src/app/**/loading.tsx,floc/packages/floc-editor/src/view/**,floc/packages/floc-editor/src/**/testing.ts,floc/packages/floc-globe/src/view/**,floc/packages/floc-globe/src/canvas/**,floc/packages/floc-globe/src/testing.ts,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Hand-written listing content: every day has the same shape, so the duplication
# check reads the data as copied code.
sonar.cpd.exclusions=floc/packages/floc-core/src/trip/explore/detail/trips/**

# Why: dev-only tools run on the developer's own machine, where a command found
# on PATH (git, ffmpeg, Chromium) is trusted.
sonar.issue.ignore.multicriteria=mts,mjs,sts,sjs
sonar.issue.ignore.multicriteria.mts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.mts.resourceKey=floc/marketing/**
sonar.issue.ignore.multicriteria.mjs.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.mjs.resourceKey=floc/marketing/**
sonar.issue.ignore.multicriteria.sts.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.sts.resourceKey=floc/apps/web/scripts/**
sonar.issue.ignore.multicriteria.sjs.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.sjs.resourceKey=floc/apps/web/scripts/**

# Make CI fail when the configured SonarQube quality gate fails.
sonar.qualitygate.wait=true
