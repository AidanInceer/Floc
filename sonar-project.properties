sonar.projectKey=AidanInceer_Floc
sonar.organization=aidaninceer
sonar.projectName=Floc

# Only the product code under ./floc is in Sonar's analysis scope.
sonar.sources=floc
sonar.tests=floc
sonar.inclusions=floc/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts
sonar.test.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Vitest writes LCOV reports in each package that has a test script.
sonar.javascript.lcov.reportPaths=floc/apps/mobile/coverage/lcov.info,floc/apps/web/coverage/lcov.info,floc/packages/floc-api/coverage/lcov.info,floc/packages/floc-core/coverage/lcov.info,floc/packages/floc-editor/coverage/lcov.info

# Keep all floc code in Sonar's code-quality analysis, but match the unit-test
# boundary: native screens and presentational components are not covered by
# the Node-based Vitest suites.
# Tool config files (eslint, vitest, next, playwright) hold no app logic to test.
sonar.coverage.exclusions=floc/apps/mobile/app/**,floc/apps/**/src/components/**,floc/apps/**/src/app/**/page.tsx,floc/packages/floc-editor/src/view/**,floc/packages/floc-editor/src/**/testing.ts,**/*.config.js,**/*.config.mjs,**/*.config.ts

# Hand-written listing content: every day has the same shape, so the duplication
# check reads the data as copied code.
sonar.cpd.exclusions=floc/packages/floc-core/src/trip/explore/detail/trips/**

# Make CI fail when the configured SonarQube quality gate fails.
sonar.qualitygate.wait=true
