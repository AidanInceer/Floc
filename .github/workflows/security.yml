# Security gates. Non-negotiable: a control is fixed, never weakened to make a
# build pass.
name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    # Weekly, so a secret committed long ago still surfaces.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks enumerates a PR's commits to scope the scan; without this it
      # 403s on pull_request runs.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Why: no GITLEAKS_CONFIG. A config path that points at a missing
          # file makes gitleaks abort before scanning a single commit.

  # NOTE: actions/dependency-review-action is deliberately absent. It requires
  # GitHub Advanced Security on private repositories, which this repo does not
  # have — it fails hard rather than skipping. `pnpm audit` below covers the
  # same ground for our purposes. Revisit if the repo goes public or buys GHAS.

  audit:
    name: Known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Why: pnpm audit reads only the lockfile, so no install (13-21 s saved).
      - name: pnpm audit
        run: pnpm audit --audit-level=high
