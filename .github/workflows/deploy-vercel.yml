# Reusable Vercel deploy for ONE app in the monorepo.
#
# Do not add `on: push` here. This workflow is called by a small per-app caller
# workflow that owns the path filter, so each app deploys independently and a
# change to one venture never redeploys another.
#
# See infra/ci-cd/README.md for how to wire up a new app.
name: Deploy (Vercel)

on:
  workflow_call:
    inputs:
      app_name:
        description: Human-readable app name, used in logs and the run summary.
        required: true
        type: string
      workspace:
        description: pnpm workspace package name, e.g. finance-planner-prototype.
        required: true
        type: string
      vercel_project_id:
        description: >
          Vercel project ID (prj_...). Not a secret — it is an identifier, and
          it is useless without VERCEL_TOKEN.
        required: true
        type: string
      environment:
        description: production | preview
        required: false
        default: preview
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
    outputs:
      url:
        description: The deployed URL.
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ inputs.vercel_project_id }}

jobs:
  deploy:
    name: ${{ inputs.app_name }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Ties into GitHub's environment protection rules — production can require
    # a manual approval before this job runs.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Verify the app on its own before shipping it. `...` picks up the
      # workspace deps it relies on, so a broken shared package fails here
      # rather than in production.
      - name: Verify this app
        run: |
          pnpm turbo run typecheck test build --filter='${{ inputs.workspace }}...'

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      # Run from the repo root: the Vercel project's own Root Directory setting
      # points at the app. Setting it in the Vercel dashboard keeps the app path
      # in one place instead of duplicated across CI.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: Deploy
        id: deploy
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${{ inputs.app_name }} to $url"

      - name: Summarise
        run: |
          {
            echo "### ${{ inputs.app_name }} deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | ${{ inputs.environment }} |"
            echo "| Workspace | \`${{ inputs.workspace }}\` |"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the PR
        if: ${{ inputs.environment == 'preview' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const app = '${{ inputs.app_name }}';
            const marker = `<!-- preview:${app} -->`;
            const body = `${marker}\n**${app}** preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }
