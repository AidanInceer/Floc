# Hub CI — runs for every PR and every push to `main` or `develop`.
#
# Only workspace packages affected by the change are built, via Turborepo's
# `--filter=...[<base>]`. A docs-only or wireframe-only change therefore costs
# seconds, not minutes.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Turborepo needs history to diff against the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `...[origin/main]` = the affected packages plus everything that depends
      # on them. On main itself, diff against the previous commit.
      - name: Resolve affected filter
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=...[origin/${{ github.base_ref }}]" >> "$GITHUB_OUTPUT"
          else
            echo "value=...[HEAD^1]" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint
        run: pnpm turbo run lint --filter='${{ steps.filter.outputs.value }}'

      - name: Typecheck
        run: pnpm turbo run typecheck --filter='${{ steps.filter.outputs.value }}'

      - name: Test
        run: pnpm turbo run test --filter='${{ steps.filter.outputs.value }}'

      - name: Build
        run: pnpm turbo run build --filter='${{ steps.filter.outputs.value }}'

      # Fitness functions (#212): layering, dead code, the globals.css token
      # rules, WCAG contrast, and the bundle budget. After the build, because
      # the bundle budget measures what the build produced.
      - name: Fitness
        run: pnpm turbo run fitness --filter='${{ steps.filter.outputs.value }}'

  # Which parts of the repo this push touched. GitHub's own `paths:` filter
  # only works at the workflow level, so a job that should run for mobile
  # changes and skip a docs push has to ask git itself.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.check.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the mobile app change
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^1"
          fi
          # The packages too: `@floc/core` and `@floc/api` are compiled into
          # the phone's bundle, so a change there can break it.
          if git diff --name-only "$base" HEAD | grep -qE '^(floc/apps/mobile/|floc/packages/|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  # The phone app has no `build` script, so the `verify` job above never builds
  # it — lint, typecheck and test are all it sees. These two jobs are the rest.
  #
  # NOTHING HERE DEPLOYS. No EAS, no store, no signing. They prove the app
  # compiles; whether it *runs* is still only ever answered on a device.
  mobile:
    name: Expo · bundles for Android and iOS
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Advisory, not a gate. Expo pins a version of every dependency per SDK
      # and `pnpm add` gives you npm's latest instead — a mismatch that shows
      # up as a red screen at runtime, not an install error, which is why this
      # is worth seeing. It is red today over three config-schema notes and a
      # TypeScript major, so it reports rather than blocks until those are
      # decided on.
      - name: Doctor
        continue-on-error: true
        run: npx expo-doctor
        working-directory: floc/apps/mobile

      # Metro over the whole app, once per platform. Catches a broken import, a
      # missing asset, a `Platform.select` that only holds up on one side —
      # none of which typecheck sees. No native toolchain and no macOS runner:
      # a bundle is JavaScript, so the iOS one builds here for nothing.
      - name: Bundle
        run: npx expo export --platform android --platform ios --output-dir dist
        working-directory: floc/apps/mobile

  # The real native compile: Java, Kotlin and CMake against the committed
  # `android/` project. This is what catches a native module that was added but
  # never wired in — the class of failure a bundle cannot see.
  #
  # ALLOWED TO FAIL for now. It has never been run in CI, so it reports red on
  # the run page without blocking a push. Make it a gate once it is green.
  mobile-android:
    name: Android · native build (advisory)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # JDK 17, not the runner's default. A newer JDK's restricted-native-access
      # warning buries the real CMake error and the build looks unexplained.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Debug, not release: release wants a signing key, and a key in CI is a
      # secret this repo does not need to hold to prove the app compiles.
      - name: Assemble
        run: ./gradlew assembleDebug --no-daemon
        working-directory: floc/apps/mobile/android

  # A schema change with no migration file is how floc's production
  # database fell behind its code: `trip.tags` shipped, nothing ever altered
  # the table, and every logged-in hit on /trips threw "no such column".
  # `drizzle-kit generate` is deterministic against the committed snapshot, so
  # re-running it here proves the migrations folder already describes
  # schema.ts. A working tree that comes back dirty means the migration was
  # never generated — fail, and name the command that fixes it.
  #
  # No database is touched: `generate` diffs schema.ts against
  # drizzle/meta/*.json on disk and never opens a connection.
  migrations:
    name: Schema changes ship with a migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate migrations
        run: pnpm --filter floc-web db:generate

      # `git status --porcelain`, not `git diff`: a missing migration shows up
      # as a brand new *untracked* .sql file, which `git diff` does not report
      # at all. Checked by deliberately drifting the schema — `git diff` said
      # clean while a 0001 file sat on disk.
      - name: Fail if a migration is missing
        run: |
          drift=$(git status --porcelain -- floc/apps/web/drizzle)
          if [ -n "$drift" ]; then
            echo "::error::src/db/schema.ts changed without a migration. Run: pnpm --filter floc-web db:generate — then commit floc/apps/web/drizzle/."
            echo "$drift"
            exit 1
          fi
          echo "Migrations are in step with the schema."

  # Wireframes are plain HTML with no build step, so CI just proves they stay
  # self-contained — no external requests — which the Artifact CSP and our own
  # offline-first convention both require.
  wireframes:
    name: Wireframes stay self-contained
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for external assets and stray document wrappers
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(floc/wireframe/*.html)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No wireframes found — nothing to check."
            exit 0
          fi
          fail=0
          for f in "${files[@]}"; do
            echo "checking $f"
            if grep -nEi '(src|href)=["'"'"']https?://' "$f"; then
              echo "::error file=$f::references an external asset; inline it instead"
              fail=1
            fi
            if grep -nEi '<!doctype|<html[ >]|<body[ >]' "$f"; then
              echo "::error file=$f::should start at <title>, with no document wrapper"
              fail=1
            fi
          done
          exit $fail
