# CI. One check runner (scripts/checks/run.mjs) serves this file and local runs.
#
#   PR to develop      PR checks: lint, types, affected tests, build, fitness, quality, migrations (the fast gate)
#   push to develop    Release checks: everything, including web e2e and phone bundles
#   PR to main         Release checks on the release or hotfix commit (the full gate)
#   push to main       Main coverage, for Sonar's main-branch gate
#
# Sonar analyses every PR and main. SonarQube Cloud Free cannot analyse develop itself.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# Why: a new push to a PR replaces its old run, but every develop run finishes, so each merge gets its own verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  FLOC_NEXT_DIST_DIR: .next-verify

jobs:
  pr:
    name: PR checks
    if: github.event_name == 'pull_request' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      coverage: ${{ steps.coverage.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks pr --base "${{ github.event.pull_request.base.sha }}" --fresh
      - id: coverage
        if: always()
        run: echo "present=$(node scripts/checks/coverage-present.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.coverage.outputs.present == 'true'
        with:
          name: coverage-${{ github.sha }}
          path: floc/**/coverage/lcov.info
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-checks-${{ github.sha }}
          path: .floc/checks/
          retention-days: 7

  release:
    name: Release checks
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      coverage: ${{ steps.coverage.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter floc-web exec playwright install --with-deps chromium
      - name: Check the whole candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD^1; fi
          pnpm checks release --base "$base" --fresh --full
      - id: coverage
        if: always()
        run: echo "present=$(node scripts/checks/coverage-present.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.coverage.outputs.present == 'true'
        with:
          name: coverage-${{ github.sha }}
          path: floc/**/coverage/lcov.info
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-checks-${{ github.sha }}
          path: |
            .floc/checks/
            floc/apps/web/.e2e/report/
          retention-days: 7

  coverage:
    name: Main coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks coverage --base HEAD^1 --fresh
      - id: coverage
        run: echo "present=$(node scripts/checks/coverage-present.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: floc/**/coverage/lcov.info
          retention-days: 2

  sonarqube:
    name: SonarQube analysis
    needs: [pr, release, coverage]
    if: >-
      always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: needs.pr.outputs.coverage == 'true' || needs.release.outputs.coverage == 'true' || needs.coverage.outputs.coverage == 'true'
        with:
          name: coverage-${{ github.sha }}
          path: floc
      - name: Version
        id: version
        run: echo "version=$(node -p "require('./floc/apps/web/package.json').version")" >> "$GITHUB_OUTPUT"
      # Why: main's new-code window is "since the previous version"; without a version it never resets.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ steps.version.outputs.version }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
